services:
  - type: web
    name: powerwinner-late-signal-paper
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: LEADER_WALLET
        value: 0xf3531b23b504cf0aed4ff21325232b2a2d496685
      - key: PAPER_BUDGET_USD
        value: "10"
      - key: LEADER_POLL_INTERVAL
        value: "0.25"
      - key: DATA_DIR
        value: /var/data

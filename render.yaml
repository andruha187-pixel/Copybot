services:
  - type: web
    name: copy-simulator-v2-equity
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: LEADER_WALLET
        value: 0x13e0d447520ebe7f8eeaf7817211201b2c585204
      - key: LEADER_POLL_INTERVAL
        value: "0.25"
      - key: COPY_MULTIPLIER
        value: "1.0"
      - key: INITIAL_BALANCE
        value: "100000"
      - key: DATA_DIR
        value: /var/data

services:
  - type: web
    name: powerwinner-paper-copy
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: LEADER_WALLET
        value: 0xf3531b23b504cf0aed4ff21325232b2a2d496685
      - key: LEADER_POLL_INTERVAL
        value: "0.10"
      - key: COPY_MULTIPLIER
        value: "1.0"
      - key: INITIAL_BALANCE
        value: "100000"
      - key: ENFORCE_BALANCE
        value: "false"
      - key: DATA_DIR
        value: /var/data
